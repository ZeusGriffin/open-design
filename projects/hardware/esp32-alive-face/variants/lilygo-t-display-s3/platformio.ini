[env:lilygo_t_display_s3]
platform = espressif32
board = lilygo-t-display-s3
framework = arduino
monitor_speed = 115200
lib_deps = bodmer/TFT_eSPI
build_flags =
  -D USER_SETUP_LOADED=1
  -D ST7789_DRIVER=1
  -D TFT_WIDTH=170
  -D TFT_HEIGHT=320
  ; REQUIRED: set actual TFT_MOSI, TFT_SCLK, TFT_CS, TFT_DC,
  ; TFT_RST and TFT_BL for your exact T-Display S3 revision.
  ; DO NOT UPLOAD until verified and populated.
