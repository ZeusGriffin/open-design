*{box-sizing:border-box}body{margin:0;background:#f4f5f0;color:#20271f;font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input,select,textarea{font:inherit}button,a,input,select{min-height:44px}button{cursor:pointer;border:1px solid #d8dcd1;border-radius:8px;padding:10px 16px;background:white;color:inherit}button:hover{background:#eaf36b}a{color:inherit}aside{position:fixed;width:220px;background:#e9ece3;height:100vh;padding:30px 20px;display:flex;flex-direction:column;border-right:1px solid #d8dcd1}.logo{font-size:34px;font-weight:900;letter-spacing:-2px}.logo span{color:#73882d}aside small{letter-spacing:2px;font-size:10px;margin:10px 0 40px}nav{display:grid;gap:8px}nav button{text-align:left;border:0;background:transparent}nav button.active{background:#d9e5bd;font-weight:700}aside footer{margin-top:auto;font-size:12px;line-height:1.8}main{margin-left:220px;padding:28px 42px;max-width:1600px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;border-bottom:1px solid #d8dcd1;padding-bottom:24px}.eyebrow{font:11px monospace;letter-spacing:2px;text-transform:uppercase;color:#6d7766}.pill{border:1px solid #d5dccc;padding:7px 11px;border-radius:20px;font:11px monospace;background:#fff}.dot{color:#7c9338}h1{font-size:36px;letter-spacing:-1px;margin:35px 0 10px}h2{font-size:22px;letter-spacing:-.6px}h3{font-size:17px;margin-top:0}p{color:#66705f;line-height:1.6}.hero{border-radius:14px;background:#eaf36b;padding:30px;display:grid;grid-template-columns:1.5fr 1fr;margin:28px 0;gap:24px}.hero h2{font-size:30px;margin:10px 0}.hero p{color:#4d572b}.dark{background:#263421;color:#f0f6df;border:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:white;border:1px solid #dce0d5;border-radius:12px;padding:23px}.card p{font-size:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.tag{font:10px monospace;text-transform:uppercase;color:#627536;background:#eef3df;padding:6px 8px;border-radius:5px}.warn{background:#fff0d5;color:#895d16}.muted{color:#72806b}.boardart{height:95px;margin:20px 0;display:flex;justify-content:center;align-items:center;background:repeating-linear-gradient(0deg,#fafbf8,#fafbf8 17px,#eef0e8 18px);border-radius:8px}.chip{background:#2b3c31;border:6px solid #43564a;box-shadow:12px 0 #b6ba9c,-12px 0 #b6ba9c;color:#c4d5b0;padding:12px;font:10px monospace;border-radius:5px}.chip.orange{border-color:#e4a14c;background:#333933}.chip.blue{background:#234452;border-color:#607f89}.sectiontitle{margin:30px 0 16px}.two{display:grid;grid-template-columns:1.6fr 1fr;gap:20px}.line{padding:14px 0;border-bottom:1px solid #edf0e8}.num{font:12px monospace;color:#7b8d57;margin-right:14px}input,textarea,select{width:100%;padding:12px;border:1px solid #d5dccb;border-radius:7px;background:#fafbf7;color:#263421;margin:6px 0 14px}textarea{min-height:170px;line-height:1.6;resize:vertical}label{font-size:12px;color:#616f57}pre{background:#202b23;color:#c7d8b0;padding:20px;white-space:pre-wrap;border-radius:10px;font:12px/1.8 monospace;overflow:auto}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{text-align:left;padding:17px;border-bottom:1px solid #dce0d5;min-width:145px}th{font-size:11px;color:#748165}dialog{max-width:600px;width:94%;border:0;border-radius:15px;padding:28px}dialog::backdrop{background:#18251d80}.hidden{display:none}.note{border-left:3px solid #b5c65a;padding:12px 16px;background:#edf0e5;font-size:13px;line-height:1.6}.actions{display:flex;gap:10px;flex-wrap:wrap}.success{color:#527328}#toast{position:fixed;bottom:25px;right:20px;background:#273721;color:white;padding:15px;border-radius:8px;z-index:5;display:none}
@media(max-width:1000px){.grid{grid-template-columns:1fr 1fr}main{padding:20px}aside{width:180px}main{margin-left:180px}.two{grid-template-columns:1fr}}@media(max-width:650px){aside{position:static;width:auto;height:auto;padding:16px}aside small,aside footer{display:none}nav{display:flex;overflow:auto;margin-top:15px}nav button{white-space:nowrap}main{margin:0;padding:18px}.grid,.hero,.two{grid-template-columns:1fr}h1{font-size:34px}.top{font-size:12px}.hero{padding:24px}.card{padding:20px}.logo{font-size:28px}}
.checkpoint{display:flex;gap:14px;align-items:flex-start;padding:18px 0;border-bottom:1px solid #e0e5d9}.checkpoint input{width:24px;height:24px;min-height:24px;margin:0;flex-shrink:0;accent-color:#526e32}.checkpoint label{font-size:16px;color:#253321;cursor:pointer;flex:1}.checkpoint p{margin:7px 0;font-size:14px}.checkpoint.done label>b{text-decoration:line-through;color:#69765f}.progress{height:9px;background:#e3e8da;border-radius:8px;overflow:hidden;margin:16px 0}.progress span{display:block;height:100%;background:#759442}.savehint{font-size:12px;color:#637457}.guideintro{max-width:720px}@media(max-width:650px){.checkpoint{padding:20px 0}nav button{font-size:14px}.hero{margin:20px 0}} </style><aside><div class="logo">PLUG<span>↗</span></div><small>IDEAS INTO HARDWARE</small><nav id="nav"></nav><footer><span class="dot">●</span> iPhone first<br>Android · phase 02<br><br>WORKSPACE / ZEE<br>v0.1 · capability aware</footer></aside><main><div class="top"><span class="eyebrow">Workspace / <span id="crumb">Overview</span></span><span class="pill">● LOCAL WORKSPACE</span></div><div id="view"></div></main><dialog id="modal"></dialog><div id="toast" role="status"></div><input type="file" id="importer" accept="application/json" hidden><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const boards=[{name:'Cardputer ADV',brand:'M5STACK',chip:'ESP32-S3',style:'orange',next:'Confirm the ADV revision and open its official download-mode instructions.',check:'PASS: compatible tool identifies the chip. FAIL: no device or wrong chip.',detail:'Use the ADV-specific download procedure in M5Stack documentation. Do not reuse Wuzplay DFU tap sequences or assume standard Cardputer button mappings.',url:'https://docs.m5stack.com/en/core/Cardputer-Adv'},{name:'T-Display S3',brand:'LILYGO',chip:'ESP32-S3',style:'blue',next:'Confirm the exact T-Display S3 variant and USB connector.',check:'PASS: board identity matches the selected profile. FAIL: variant is unknown.',detail:'Confirm board revision, display driver, pin map, flash and PSRAM before compiling. Use the exact variant examples and documented BOOT / RESET sequence.',url:'https://github.com/Xinyuan-LilyGO/T-Display-S3'},{name:'Compact ESP32-C6',brand:'ESPRESSIF FAMILY',chip:'ESP32-C6 · provisional',style:'',next:'Photograph both sides and identify the maker and flash capacity.',check:'PASS: exact model and memory recorded. FAIL: profile remains provisional.',detail:'Your smaller 1.3-inch OLED device is a provisional profile. Do not choose pins, memory size, boot sequence or binary offsets until its exact model is identified.',url:'https://docs.espressif.com/projects/esptool/en/latest/esp32c6/'}];
const initial={projects:[{name:'PLUG · iPhone connection proof',board:0,status:'Blocked',notes:'Establish supported transport before any firmware write.',code:'#include <Arduino.h>\nvoid setup() { Serial.begin(115200); }\nvoid loop() { Serial.println("PLUG ready"); delay(1000); }'},{name:'LILYGO · display baseline',board:1,status:'Planned',notes:'Reuse existing display work after exact board confirmation.',code:'// Import the approved LILYGO source here.'}],evidence:{},links:[['Existing open-design workspace','https://github.com/ZeusGriffin/open-design'],['Cardputer external screen upstream','https://github.com/guicmg/cardputer_adv_external_screen'],['esptool documentation','https://docs.espressif.com/projects/esptool/en/latest/'],['Browser serial capabilities','https://developer.chrome.com/docs/capabilities/serial']],logs:'No compile job submitted. Cloud compiler is not connected.',flash:'Not started · no flash transport configured',notes:'PLUG baseline: iPhone first; Android later. Reuse GitHub and the master Obsidian vault. No direct vault sync configured.'};
let state;try{state=JSON.parse(localStorage.getItem('plug-v1'))||structuredClone(initial)}catch{state=structuredClone(initial)}let page=state.lastPage||'Setup guide',selected=0;
function save(){localStorage.setItem('plug-v1',JSON.stringify(state))}function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',2500)}
const pages=['Setup guide','Memory cards','Overview','Boards','Projects','Build & flash','Wireless DFU','Templates','Libraries','Compare','Troubleshoot','Knowledge'];function go(p){page=p;state.lastPage=p;save();render();window.scrollTo(0,0)}function btn(t,fn,cls=''){return `<button class="${cls}" onclick="${fn}">${t}</button>`}function title(k,t,d){return `<div class="eyebrow" style="margin-top:28px">${k}</div><h1>${t}</h1><p>${d}</p>`}function evidence(id,next,check){let e=state.evidence[id]||{};return `<div class="line"><b>Smallest next action</b><p>${next}</p><b>Verification</b><p>${check}</p><label>Observed result<select onchange="record('${id}',this.value)">${['Not tested','Pass','Fail'].map(v=>`<option ${e.result===v?'selected':''}>${v}</option>`).join('')}</select></label><label>Evidence / device / date<input value="${esc(e.note||'')}" onchange="note('${id}',this.value)" placeholder="Record what you actually observed"></label></div>`}function record(id,v){state.evidence[id]={...state.evidence[id],result:v};save();toast('Result saved')}function note(id,v){state.evidence[id]={...state.evidence[id],note:v};save()}
function card(b,i){return `<article class="card"><div class="row"><span class="eyebrow">${b.brand}</span><span class="tag warn">${i===2?'Identify board':'Transport untested'}</span></div><div class="boardart"><div class="chip ${b.style}">${b.chip}<br>▦ ▦ ▦ ▦</div></div><h3>${b.name}</h3><p>${b.next}</p><div class="row"><span class="muted">${state.evidence['board'+i]?.result||'Not tested'}</span>${btn('Open profile ↗',`profile(${i})`)}</div></article>`}
function profile(i){let b=boards[i];$('#modal').innerHTML=`<div class="row"><span class="eyebrow">BOARD PROFILE</span>${btn('Close',"document.querySelector('#modal').close()")}</div><h2>${b.name}</h2><span class="tag warn">Hardware verification pending</span><p>${b.detail}</p><a href="${b.url}" target="_blank" rel="noopener">Official board instructions ↗</a>${evidence('board'+i,b.next,b.check)}`;$('#modal').showModal()}
function render(){ $('#nav').innerHTML=pages.map((p,i)=>btn(p,`go('${p}')`,page===p?'active':'')).join('');$('#crumb').textContent=page;let h='';
if(page==='Setup guide')h=guideView();
if(page==='Memory cards')h=cardGuide();
if(page==='Overview')h=title('YOUR MOBILE FIRMWARE WORKBENCH','Small device. Big ideas.','Write, organize and prepare firmware. Know exactly what your phone and board can do next.')+`<section class="hero"><div><span class="eyebrow">01 / START WITH THE CONNECTION</span><h2>Pick up where you left off.</h2><p>Check this browser’s connection capabilities before connecting your first board.</p>${btn('Continue setup →',"go('Setup guide')",'dark')}</div><div style="border-left:1px solid #b9c356;padding-left:24px"><span class="eyebrow">CURRENT DIRECTION</span><h3 style="margin-top:18px">iPhone → ESP32</h3><p>USB-C is the connector. A supported transport is the missing proof.</p><span class="pill">iPHONE FIRST / ANDROID LATER</span></div></section><div class="row sectiontitle"><h2>Your board bench <span class="muted">/ 03</span></h2>${btn('Compare boards',"go('Compare')")}</div><div class="grid">${boards.map(card).join('')}</div><div class="two sectiontitle"><section class="card"><div class="row"><h2>Project queue</h2>${btn('View all ↗',"go('Projects')")}</div>${state.projects.map(p=>`<div class="row line"><b>${esc(p.name)}</b><span class="tag warn">${esc(p.status)}</span></div>`).join('')}</section><section class="card"><span class="eyebrow">REALITY CHECK</span><h2>Prepared ≠ flashed.</h2><p>This Site edits and tracks your work. Cloud compilation and firmware writing require real services and a supported device transport.</p>${btn('See capability matrix',"go('Compare')")}</section></div>`;
if(page==='Boards')h=title('HARDWARE / PROFILES','Your board bench.','Exact board identities first. Pin maps and binaries follow the confirmed revision.')+`<div class="grid">${boards.map(card).join('')}</div>`;
if(page==='Projects'){let p=state.projects[selected];h=title('SOURCE / TRACKER','Make the next build count.','Editable source and milestones, saved on this browser. Export a backup to carry your work elsewhere.')+`<div class="two"><section class="card"><div class="row"><h2>Firmware projects</h2>${btn('+ New project','newProject()')}</div>${state.projects.map((p,i)=>`<div class="line">${btn(esc(p.name),`selected=${i};render()`,i===selected?'dark':'')} <p>${esc(p.status)} · ${boards[p.board].name}</p></div>`).join('')}</section><section class="card"><label>Project name<input id="pname" value="${esc(p.name)}"></label><label>Board<select id="pboard">${boards.map((b,i)=>`<option value="${i}" ${p.board==i?'selected':''}>${b.name}</option>`).join('')}</select></label><label>Status<select id="pstatus">${['Planned','In progress','Blocked','Ready for device test','Verified on device'].map(s=>`<option ${p.status===s?'selected':''}>${s}</option>`).join('')}</select></label><label>Notes<textarea id="pnotes">${esc(p.notes)}</textarea></label>${btn('Save project','saveProject()','dark')}</section></div><section class="card sectiontitle"><div class="row"><h2>Source editor <span class="muted">/ main.ino</span></h2>${btn('Download source','downloadSource()')}</div><label>Firmware source<textarea id="pcode" spellcheck="false" style="min-height:270px;font-family:monospace">${esc(p.code)}</textarea></label>${btn('Save source','saveCode()','dark')}${evidence('editor','Save your source, reload, and open this project.','PASS: saved text survives reload. FAIL: text changes or disappears.')}</section>`}
if(page==='Build & flash')h=title('PIPELINE / CONNECTION','From source to silicon.','Real environment checks. Explicit service boundaries. No simulated successful builds or flashes.')+`<div class="two"><section class="card"><h2>01 · Connection preflight</h2><label>Host<select id="host"><option>iPhone / iOS</option><option>Android · later phase</option><option>Desktop diagnostic only</option></select></label><label>Target board<select>${boards.map(b=>`<option>${b.name}</option>`).join('')}</select></label><div class="actions">${btn('Check browser APIs','probe()','dark')}${btn('Request serial port','connect()')}</div><pre id="probe">Not checked in this session.</pre><p>A capability check detects APIs, not USB-OTG wiring, cable data support, power sufficiency or a connected board. A power LED alone proves none of these.</p>${evidence('connection','Use a known data cable, then run the browser check.','PASS: compatible transport opens and identifies the exact board. FAIL: API absent, denied, or identity unknown.')}</section><section class="card"><h2>02 · Cloud compile</h2><span class="tag warn">Service not connected</span><p>Prepare an artifact for an existing GitHub Actions or cloud compile workflow. No hosted compiler is configured in this version.</p>${btn('Export build request','buildRequest()','dark')}${btn('Record compile log','logDialog()')}<pre>${esc(state.logs)}</pre>${evidence('compile','Export the request and run your existing cloud workflow.','PASS: real build log plus binary and matching board config. FAIL: no job, compile errors, or wrong target.')}</section></div><section class="card sectiontitle"><h2>03 · Flash & verify</h2><p>Already updating wirelessly? Configure Bluetooth DFU or Wi-Fi OTA for your device.</p>${btn('Set up wireless DFU ↗',"go('Wireless DFU')")}<div class="note">Direct iPhone browser USB serial flashing is not established. This Site does not implement a firmware writer. A native iPhone transport or a previously installed OTA updater is a separate integration to prove.</div><p><b>Flash status:</b> ${esc(state.flash)}</p><label>Firmware binary<input type="file" id="binary" accept=".bin,.uf2,.hex" onchange="inspectFile(this)"></label><pre id="binaryinfo">No binary selected. Selection never writes to a board.</pre>${btn('Why is flashing blocked?',"go('Troubleshoot')")}${evidence('flash','Verify target, partition layout, offsets and recovery method using the official board guide.','PASS: actual tool reports write + verify and firmware boots as expected. FAIL: timeout, mismatch, or boot failure. Hardware test required.')}</section>`;
if(page==='Wireless DFU'){let w=state.wireless||{};h=title('WIRELESS / FIRMWARE UPDATES','Update without a cable.','Bluetooth DFU and Wi-Fi OTA are part of PLUG’s direction. Your existing workflow is user-reported; PLUG transport integration remains pending.')+`<div class="note">Wireless DFU requires a compatible updater already on the device. The transport, firmware format, bootloader and app must match. This page prepares and records the workflow; it does not yet transmit firmware.</div><div class="two sectiontitle"><section class="card"><span class="tag">User-reported capability</span><h2>Wireless update profile</h2><label>Device / exact revision<input id="wdevice" value="${esc(w.device||'')}"></label><label>Update route<select id="wroute">${['Bluetooth DFU','Wi-Fi OTA'].map(v=>`<option ${w.route===v?'selected':''}>${v}</option>`).join('')}</select></label><label>Existing iPhone app name<input id="wapp" value="${esc(w.app||'')}" placeholder="App you already use for DFU"></label><label>App Store / documentation / device updater URL<input id="wurl" type="url" value="${esc(w.url||'')}"></label><label>Accepted firmware format and updater protocol<input id="wformat" value="${esc(w.format||'')}" placeholder="Record documented format; do not guess"></label><label>DFU entry steps / recovery / notes<textarea id="wnotes">${esc(w.notes||'')}</textarea></label>${btn('Save wireless profile','saveWireless()','dark')}${btn('Open saved updater','openUpdater()')}<p>Open updater launches your saved app or device web page in a new tab. It never uploads a file automatically.</p></section><section class="card"><h2>Guided upload preparation</h2><div class="line"><span class="num">01</span>Identify the exact device, installed updater and matching iPhone app.</div><div class="line"><span class="num">02</span>Use its documented DFU entry process. For Bluetooth, pair or connect inside the required app. For Wi-Fi, join the documented network or device access point.</div><div class="line"><span class="num">03</span>Confirm firmware target, accepted package format, version and recovery instructions. A generic .bin is not universally interchangeable with a DFU package.</div><div class="line"><span class="num">04</span>Upload in the compatible updater, follow its power instructions, then reconnect and read the installed version.</div><label>Firmware package — inspect locally<input type="file" onchange="wirelessFile(this)"></label><pre id="wirelessFile">No package selected. No wireless transmission occurs here.</pre>${evidence('bleDFU','Save the app name and exact device used in your existing Bluetooth DFU workflow.','PASS: updater confirms transfer and the device reports the intended firmware version after reboot. FAIL: rejected package, failed transfer or wrong version.')}${evidence('wifiOTA','Record the device’s documented Wi-Fi updater and required network mode.','PASS: actual upload completes and installed version matches after reboot. FAIL: updater unreachable, update rejected or boot failure.')}</section></div>`;}
if(page==='Libraries')h=title('DEPENDENCIES / REUSE','Build your parts shelf.','Track exact versions and board compatibility. No dependency is installed by saving a record.')+`<div class="two"><section class="card"><h2>Saved libraries</h2>${(state.libraries||[]).map(l=>`<div class="line"><h3>${esc(l.name)}</h3><p>${esc(l.version)} · ${esc(l.board)}</p><p>${esc(l.notes)}</p></div>`).join('')||'<p>No libraries recorded yet. Import approved dependencies from your existing project.</p>'}</section><section class="card"><label>Library name<input id="lname"></label><label>Pinned version or commit<input id="lversion"></label><label>Board compatibility<input id="lboard"></label><label>Source URL and verification notes<textarea id="lnotes"></textarea></label>${btn('Save library','addLibrary()','dark')}${evidence('libraries','Record one dependency from an approved project with its exact version.','PASS: minimal example compiles and runs on the exact board. FAIL: missing version, build error or runtime mismatch.')}</section></div>`;
if(page==='Compare')h=title('CAPABILITIES / EVIDENCE','Choose a proven path.','Documentation support is separate from a successful test on your device.')+`<section class="card tablewrap"><table><thead><tr><th>Feature / route</th><th>Evidence state</th><th>Smallest next action</th><th>Pass / fail check</th></tr></thead><tbody>${[['Source editing + tracking','Implemented · browser local','Save and reload a project','Pass: exact text retained / Fail: lost edits'],['iPhone Safari → USB serial','Blocked in this browser when API absent','Run capability check','Pass: usable transport + chip identity / Fail: API absent'],['Cloud compilation','Planned · no backend','Export build request','Pass: actual artifact + build log / Fail: no artifact'],['Native iPhone USB transport','Experimental · not integrated','Identify supported native transport','Pass: chip ID read on iPhone / Fail: access denied'],['Bluetooth DFU from iPhone','User-reported · PLUG integration pending','Record existing app + device updater','Pass: transfer + correct installed version / Fail: rejected update'],['Wi-Fi OTA from iPhone','User-reported · PLUG integration pending','Confirm installed OTA firmware + updater URL','Pass: verified update + boot / Fail: updater absent'],['Android USB-OTG','Later phase · device dependent','Keep deferred until iPhone proof','Pass: supported tool + chip ID / Fail: enumeration fails']].map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></section><div class="grid sectiontitle">${boards.map(card).join('')}</div><p>USB-C does not imply serial access. ESP32 download mode is distinct from USB DFU; only use DFU when the device documentation explicitly specifies it.</p>`;
if(page==='Templates')h=title('REUSABLE / STARTERS','Start from something useful.','Copy a starter, adapt it to the exact board, and keep your approved code intact.')+`<div class="grid">${[['Serial heartbeat','code'],['AI firmware brief','prompt'],['Cloud compile checklist','build'],['Library manifest','library'],['Device verification note','verify'],['Recovery checklist','recover']].map(([t,id])=>`<section class="card"><span class="tag">${id==='code'?'Arduino':'Template'}</span><h2>${t}</h2><p>Editable, reusable starting point. Review before applying to hardware.</p>${btn('Open template ↗',`template('${id}')`)}</section>`).join('')}</div>${evidence('templates','Copy a template into a project and replace all placeholders.','PASS: exact model, dependencies and verification are explicit. FAIL: placeholders or guessed pin maps remain.')}`;
if(page==='Troubleshoot')h=title('GUIDED / RECOVERY','Find the actual blocker.','Choose the symptom. Follow one small check at a time.')+`<section class="card"><label>What is happening?<select id="symptom" onchange="trouble(this.value)"><option value="">Choose a symptom</option><option value="ios">Unsupported iPhone connection</option><option value="com">COM port not detected</option><option value="boot">Download / DFU mode confusion</option><option value="driver">Driver issue</option><option value="compile">ECONNREFUSED ::1:62950</option><option value="power">Board powers on but no data</option></select></label><div id="steps"><p>Select a symptom to begin.</p></div></section>`;
if(page==='Knowledge')h=title('KNOWLEDGE / CONTINUITY','Keep the useful work close.','Existing project context, reference links and portable notes. GitHub and Obsidian are not automatically synchronized.')+`<div class="two"><section class="card"><h2>Saved links</h2>${[...state.links,...boards.map(b=>[b.name+' official guide',b.url])].map(([n,u])=>`<div class="line"><a target="_blank" rel="noopener" href="${esc(u)}">${esc(n)} ↗</a></div>`).join('')}<h3 style="margin-top:24px">Add reference</h3><label>Title<input id="linkname"></label><label>URL<input id="linkurl" type="url"></label>${btn('Save link','addLink()')}</section><section class="card"><h2>Project state card</h2><p>Baseline reused from the existing PLUG project context. GitHub PLUG search returned no matching source. No vault contents were retrieved; paste approved notes here.</p><label>Master notes<textarea id="knowledge">${esc(state.notes)}</textarea></label>${btn('Save notes',"state.notes=$('#knowledge').value;save();toast('Notes saved')",'dark')}<h2>Take your workspace with you</h2><p>Local browser storage only. Export for backup or transfer; importing replaces this browser’s PLUG data after confirmation.</p><div class="actions">${btn('Export workspace','exportData()')}${btn('Import workspace',"$('#importer').click()")}${btn('Export Obsidian note','obsidian()')}</div>${evidence('knowledge','Import or paste the approved GitHub / Obsidian project state.','PASS: source, revision and board match. FAIL: missing or stale source.')}</section></div>`;
$('#view').innerHTML=h;}
function newProject(){state.projects.push({name:'Untitled firmware',board:0,status:'Planned',notes:'',code:''});selected=state.projects.length-1;save();render()}function saveProject(){Object.assign(state.projects[selected],{name:$('#pname').value,board:Number($('#pboard').value),status:$('#pstatus').value,notes:$('#pnotes').value});save();toast('Project saved');render()}function saveCode(){state.projects[selected].code=$('#pcode').value;save();toast('Source saved')}function download(name,text,type='text/plain'){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function downloadSource(){saveCode();download('main.ino',state.projects[selected].code)}function exportData(){download('PLUG-workspace.json',JSON.stringify(state,null,2),'application/json')}function obsidian(){download('PLUG-state.md','# PLUG — iPhone-first firmware workspace\n\n'+state.notes+'\n\n## Projects\n'+state.projects.map(p=>'### '+p.name+'\nStatus: '+p.status+'\n'+p.notes+'\n').join('\n')+'\n## References\n'+state.links.map(([n,u])=>'- ['+n+']('+u+')').join('\n'))}
$('#importer').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d.projects)||!d.projects.length||!d.projects.every(p=>typeof p.name==='string'&&typeof p.code==='string'&&Number.isInteger(p.board)&&boards[p.board])||!Array.isArray(d.links)||!d.links.every(l=>Array.isArray(l)&&/^https?:\/\//.test(l[1])))throw Error('Invalid workspace');if(confirm('Replace this browser’s PLUG workspace with the imported file? Export first if needed.')){state={...structuredClone(initial),...d};selected=0;save();render();toast('Workspace imported')}}catch(e){toast(e.message)}};
function probe(){let serial='serial'in navigator,usb='usb'in navigator;$('#probe').textContent=`Secure context: ${isSecureContext?'YES':'NO'}\nWeb Serial: ${serial?'API PRESENT — device untested':'UNAVAILABLE — serial route blocked'}\nWebUSB: ${usb?'API PRESENT — not a flash implementation':'UNAVAILABLE'}\nUSB-OTG / cable / power: requires physical test\nNo device has been identified by this check.`}let port;async function connect(){if(!navigator.serial){toast('Serial API unavailable. Open troubleshooting.');return}try{port=await navigator.serial.requestPort();await port.open({baudRate:115200});$('#probe').textContent='Serial port opened at 115200. Chip identity and flashing remain unverified. '+JSON.stringify(port.getInfo());await port.close()}catch(e){$('#probe').textContent='Connection failed: '+e.message}}
function inspectFile(e){let f=e.files[0];$('#binaryinfo').textContent=f?`Selected: ${f.name}\nBytes: ${f.size}\nTarget, offsets and integrity: NOT VERIFIED\nFlash writer: NOT CONFIGURED`:'No binary selected'}function buildRequest(){download('PLUG-build-request.json',JSON.stringify({project:state.projects[selected],required:['exact board revision','framework + dependency versions','partition layout','binary + SHA256','real build log'],status:'Request only — not submitted'},null,2),'application/json');toast('Build request exported; no job submitted')}
function logDialog(){$('#modal').innerHTML=`<h2>Record real compile output</h2><label>Paste provider log<textarea id="logedit">${esc(state.logs)}</textarea></label>${btn('Save log',"state.logs=$('#logedit').value;save();$('#modal').close();render()",'dark')}${btn('Cancel',"$('#modal').close()")}`;$('#modal').showModal()}
const templates={code:initial.projects[0].code,prompt:'Goal: [one firmware behavior]\nExact board / revision: [required]\nFramework and version: [required]\nApproved source / commit: [link]\nPins / flash / PSRAM: [verified values only]\nPreserve: [working baseline]\nChange: [one bounded feature]\nVerify: [observable pass/fail]\nDo not invent board pins or claim a flash succeeded without hardware evidence.',build:'1. Confirm board + chip + revision\n2. Pin framework and library versions\n3. Compile with existing cloud workflow\n4. Save real build logs and artifact SHA256\n5. Confirm partition map + offsets\n6. Test supported phone transport\n7. Flash only with known recovery path\n8. Verify firmware boots',library:'Library name: [required]\nSource URL: [required]\nPinned version / commit: [required]\nLicense: [check]\nBoards tested: [physical evidence]\nExample: [path]\nNext: compile the smallest example\nPASS: expected behavior on exact board\nFAIL: compile or runtime mismatch',verify:'Device / revision:\nFirmware commit / SHA256:\nPhone / OS / transport:\nObserved output:\nResult: NOT TESTED / PASS / FAIL\nEvidence and date:\nNext smallest action:',recover:'Record current firmware + backup availability.\nFind exact board recovery instructions.\nDistinguish ROM download mode from DFU.\nConfirm data cable and adequate power.\nDo not erase flash or alter eFuses as a troubleshooting shortcut.'};function template(id){$('#modal').innerHTML=`<h2>Reusable ${id} template</h2><label>Adapt before reuse<textarea id="templateText">${esc(templates[id])}</textarea></label>${btn('Copy text','copyTemplate()','dark')}${btn('Download',"download('PLUG-template.txt',$('#templateText').value)")}${btn('Close',"$('#modal').close()")}`;$('#modal').showModal()}async function copyTemplate(){try{await navigator.clipboard.writeText($('#templateText').value);toast('Copied')}catch{ $('#templateText').select();toast('Select and copy the text')}}
const flows={ios:['Check capability','Run the browser API check. Installing Windows drivers cannot add a missing iPhone browser API.','API unavailable? Keep editing on iPhone. Prove a compatible native transport or an existing OTA path before flashing.','PASS: exact chip identified by supported iPhone transport. FAIL: API absent or no chip ID.'],com:['Identify the host','COM ports are Windows terminology. On iPhone, use the supported transport check instead.','On Windows diagnostic equipment: inspect Device Manager, reconnect with a known data cable, then identify VID/PID and exact USB bridge. Do not assume the old COM7 is current.','PASS: stable device enumeration and chip identity. FAIL: absent or repeatedly disconnecting.'],boot:['Use board-specific instructions','Open the exact board profile and official guide. Download mode and DFU are different protocols.','For documented ESP32-S3 BOOT / RESET boards, follow the official boot-mode sequence; Cardputer ADV may have a different physical procedure. Avoid guessed tap sequences.','PASS: compatible tool detects ROM loader and chip. FAIL: normal firmware or timeout.'],driver:['Identify before installing','Read USB hardware IDs and bridge model on the diagnostic host.','Use only the bridge manufacturer’s official driver when required. An iPhone Safari transport limitation is not a Windows driver problem.','PASS: correct driver enumerates device. FAIL: unknown device or no data.'],compile:['Compiler connection issue','ECONNREFUSED ::1:62950 indicates an unreachable localhost service from the earlier development setup. It does not prove a board or USB failure.','Restart or reconnect the relevant IDE / compiler service, then build a minimal example before troubleshooting the cable.','PASS: actual compiler executes and emits artifact. FAIL: same refused endpoint.'],power:['Separate power from data','Try a known data-capable cable and inspect the correct USB connector.','Check manufacturer power requirements. A lit display is not evidence of serial connectivity. Check host support before adding hubs or adapters.','PASS: stable transport enumeration. FAIL: power only.']};function trouble(id){if(!flows[id])return;let f=flows[id];$('#steps').innerHTML=`<h2>${f[0]}</h2><div class="line"><span class="num">01</span>${f[1]}</div><div class="line"><span class="num">02</span>${f[2]}</div>${evidence('trouble'+id,f[1],f[3])}${btn('Open board guides',"go('Boards')")}`}
function cardGuide(){let c=state.cardSetup||{},os=c.os||'Windows',use=c.use||'ESP32 / embedded device',key=os+':'+use,check=c.checks?.[key]||{},items=[['backup','Back up the card','Copy anything you need somewhere else and confirm the copy opens. Formatting erases the selected card.'],['identify','Identify the removable card','Match its label, capacity and removable-drive identity in the OS tool. Disconnect unrelated external drives. If it is not detected, stop and try another reader, port or card.'],['format','Format with the correct tool',use==='Raspberry Pi OS image'?'Use Raspberry Pi Imager to write your selected OS image. A separate format is generally unnecessary; writing the image replaces the card layout.':use==='ESP32 / embedded device'?'Check the exact board firmware documentation for required file system, capacity and partition layout. Do not assume your 64 GB exFAT card works or that the standard SD formatter will produce the device-specific layout.':'Use the official SD Association formatter for standard SD layouts. For a file system chosen in the OS tool, confirm compatibility with every device that will use the card.'],['verify','Eject, reconnect and test','Check capacity and file system in the OS. For a data card, copy a test file, eject, reconnect and open it. Then verify it is readable in the target device. For an OS image, confirm the target Pi boots.']];return title('STORAGE / GUIDED PREPARATION','Get your memory card ready.','Mac and Windows steps, with saved checkpoints. Actual formatting happens in the OS or official formatting app.')+`<div class="two"><section class="card"><label>Computer<select onchange="cardChoice('os',this.value)">${['Windows','Mac'].map(v=>`<option ${v===os?'selected':''}>${v}</option>`).join('')}</select></label><label>What will use the card?<select onchange="cardChoice('use',this.value)">${['ESP32 / embedded device','Mac + Windows data exchange','Raspberry Pi OS image'].map(v=>`<option ${v===use?'selected':''}>${v}</option>`).join('')}</select></label><label>Card label, capacity and exact target device<input value="${esc(c.identity||'')}" oninput="cardText('identity',this.value)" placeholder="Record these from the physical card and OS"></label><label>Required file system / documentation<textarea oninput="cardText('requirements',this.value)" placeholder="Record the requirement from the target firmware documentation">${esc(c.requirements||'')}</textarea></label><div class="note"><b>What you need</b><br>A compatible SD/microSD reader connected to the Mac or Windows computer. Use an adapter if the computer’s ports require one. An iPhone-connected reader does not give this Site permission to format raw storage.</div><h2>${os} tools</h2><p>${os==='Windows'?'Use File Explorer to inspect a detected data volume; use Disk Management to inspect whether the physical card appears. Do not format the computer’s internal drive.':'Use Disk Utility → View → Show All Devices to inspect the external card. Confirm its physical identity before using Erase.'}</p><p><a href="https://www.sdcard.org/downloads/formatter/" target="_blank" rel="noopener">Official SD Card Formatter · Windows / Mac ↗</a></p><p><a href="https://www.raspberrypi.com/software/" target="_blank" rel="noopener">Raspberry Pi Imager ↗</a></p><span class="tag warn">Direct in-app formatting: not connected</span><p>A future desktop companion needs OS drive access and a specific drive confirmation before erasing anything. No card is detected or formatted by this Site.</p></section><section class="card"><h2>Your preparation checklist</h2><p>Progress is separate for each computer and card use. Checkmarks are your records, not automatic drive verification.</p>${items.map(([id,t,d])=>`<div class="checkpoint ${check[id]?'done':''}"><input id="card-${id}" aria-label="${t}" type="checkbox" ${check[id]?'checked':''} onchange="cardCheck('${id}',this.checked)"><label for="card-${id}"><b>${t}</b><p>${d}</p></label></div>`).join('')}<label style="display:block;margin-top:20px">Result or where you stopped<textarea oninput="cardText('notes',this.value)">${esc(c.notes||'')}</textarea></label>${btn('Save & leave for now',"save();toast('Card preparation checkpoint saved')",'dark')}<p class="savehint">Saved on this browser. Export workspace in Knowledge for backup or transfer.</p><div class="note"><b>Smallest next action</b><br>Confirm the exact target device’s required format before erasing the card.<br><b>PASS:</b> expected capacity and format, test file survives reconnection, and target device reads the card (or Pi boots).<br><b>FAIL:</b> card missing, wrong layout, read error or failed boot.</div></section></div>`;}
function cardChoice(k,v){state.cardSetup??={};state.cardSetup[k]=v;save();render()}
function cardText(k,v){state.cardSetup??={};state.cardSetup[k]=v;save()}
function cardCheck(id,v){state.cardSetup??={};let c=state.cardSetup,key=(c.os||'Windows')+':'+(c.use||'ESP32 / embedded device');c.checks??={};(c.checks[key]??={})[id]=v;save();render()}
function guideData(){let g=state.guide||{},b=boards[g.board||0],route=g.route||'Bluetooth DFU';let common=[['identity','Confirm your device',b.next+' '+b.detail],['package','Choose matching firmware','Check the exact device revision, firmware version and accepted package format. Keep your recovery instructions available.']];let path=route==='Bluetooth DFU'?[['app','Open the compatible iPhone app','Record the app and updater protocol in Wireless DFU. PLUG does not yet send firmware over Bluetooth.'],['mode','Put the device in wireless DFU mode','Follow your device’s documented steps, then connect inside its compatible app. A Bluetooth connection alone does not prove update support.'],['transfer','Upload using the compatible app','Choose the documented firmware package. Follow its power and reconnect instructions. Mark this only after the updater reports success.']]:route==='Wi-Fi OTA'?[['network','Connect to the right Wi-Fi network','Use the device’s documented local network or access point. The board must already have a compatible OTA updater installed.'],['updater','Open the device’s updater','Save its documented updater URL in Wireless DFU. PLUG does not yet upload firmware to it.'],['transfer','Upload in the device updater','Select the matching firmware and wait for the updater’s actual success message. Follow its power instructions.']]:[['cable','Check the USB connection','Use a known data cable and adequate power. USB-C alone does not prove firmware access.'],['transport','Check phone support','Run Build & flash → Check browser APIs. If the required API is absent, stop this route; a compatible native iPhone updater must be proven.'],['transfer','Use a supported firmware tool','PLUG has no USB firmware writer yet. Complete this checkpoint only after a real compatible tool verifies a write to the correct chip.']];return [...common,...path,['boot','Check the device after restart','PASS: device boots and reports the intended firmware version. FAIL: wrong version, no boot, or error. Record what happened below.']];}
function guideView(){let g=state.guide||{},board=g.board||0,route=g.route||'Bluetooth DFU',key=board+':'+route,checks=g.checks?.[key]||{},steps=guideData(),count=steps.filter(([id])=>checks[id]).length,next=steps.find(([id])=>!checks[id]);return title('START HERE','One step at a time.','Choose your device and connection. Check off each step as you finish it, then come back anytime.')+`<section class="card guideintro"><div class="row"><h2>Your setup</h2><span class="savehint">${g.saved?'Saved '+esc(new Date(g.saved).toLocaleString()):'Saves automatically as you go'}</span></div><label>What are you updating?<select onchange="guideChoice('board',Number(this.value))">${boards.map((b,i)=>`<option value="${i}" ${board===i?'selected':''}>${b.name}</option>`).join('')}</select></label><label>How will you connect?<select onchange="guideChoice('route',this.value)">${['Bluetooth DFU','Wi-Fi OTA','USB-C'].map(r=>`<option ${route===r?'selected':''}>${r}</option>`).join('')}</select></label><p>Progress is kept separately for each device and connection method.</p><div class="progress" role="progressbar" aria-label="Setup progress" aria-valuenow="${count}" aria-valuemin="0" aria-valuemax="${steps.length}"><span style="width:${count/steps.length*100}%"></span></div><div class="row"><b>${count} of ${steps.length} steps checked</b><span class="tag">${route==='USB-C'?'Support check required':'Updater integration pending'}</span></div><div class="note" style="margin-top:18px"><b>${next?'Next: '+next[1]:'Checklist finished'}</b><br>${next?next[2]:'Your checkmarks record your observations. They do not automatically verify a firmware transfer.'}</div>${steps.map(([id,t,d],i)=>`<div class="checkpoint ${checks[id]?'done':''}"><input aria-label="${esc(t)}" id="step-${id}" type="checkbox" ${checks[id]?'checked':''} onchange="guideCheck('${id}',this.checked)"><label for="step-${id}"><b>${i+1}. ${t}</b><p>${d}</p></label></div>`).join('')}<label style="display:block;margin-top:22px">Where did you stop? Any errors?<textarea placeholder="Example: connected to the app; waiting for the correct firmware package" oninput="guideNote(this.value)">${esc(g.notes?.[key]||'')}</textarea></label><div class="actions">${btn('Save & leave for now',"guidePause()",'dark')}${btn('Get help',"go('Troubleshoot')")}${btn('Update app details',"go('Wireless DFU')")}</div><p class="savehint">Saved on this browser and device. Use Knowledge → Export workspace for backup or moving to another phone. No account sync is connected.</p></section>`;}
function guideKey(){return (state.guide?.board||0)+':'+(state.guide?.route||'Bluetooth DFU')}
function guideTouch(){state.guide.saved=new Date().toISOString();state.lastPage='Setup guide';save()}
function guideChoice(k,v){state.guide??={};state.guide[k]=v;guideTouch();render()}
function guideCheck(id,v){state.guide??={};state.guide.checks??={};(state.guide.checks[guideKey()]??={})[id]=v;guideTouch();render()}
function guideNote(v){state.guide??={};state.guide.notes??={};state.guide.notes[guideKey()]=v;guideTouch()}
function guidePause(){state.guide??={};guideTouch();toast('Checkpoint saved. Return on this browser to resume.');render()}
function saveWireless(){let url=$('#wurl').value.trim();if(url&&!/^https?:\/\//i.test(url))return toast('Use an http or https updater / documentation URL');state.wireless={device:$('#wdevice').value,route:$('#wroute').value,app:$('#wapp').value,url,format:$('#wformat').value,notes:$('#wnotes').value};save();toast('Wireless profile saved')}function openUpdater(){let u=state.wireless?.url;if(!u)return toast('Save an updater URL first');if(/^https?:\/\//i.test(u))window.open(u,'_blank','noopener')}async function wirelessFile(el){let f=el.files[0];if(!f)return;let hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',await f.arrayBuffer()))).map(x=>x.toString(16).padStart(2,'0')).join('');$('#wirelessFile').textContent='Package: '+f.name+'\nBytes: '+f.size+'\nSHA256: '+hash+'\nCompatibility: not verified. Transfer: not started.'}function addLibrary(){let name=$('#lname').value.trim();if(!name||!$('#lversion').value.trim())return toast('Name and pinned version are required');(state.libraries??=[]).push({name,version:$('#lversion').value,board:$('#lboard').value,notes:$('#lnotes').value});save();render();toast('Library recorded')}function addLink(){let n=$('#linkname').value,u=$('#linkurl').value;try{let url=new URL(u);if(!['https:','http:'].includes(url.protocol)||!n.trim())throw Error();state.links.push([n,url.href]);save();render()}catch{toast('Enter a title and a valid https URL')}}render();
</script></html>
