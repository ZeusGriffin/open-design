<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#131718"><title>LESS — Your AI Control Room</title><style>
:root{color-scheme:dark;--bg:#101315;--panel:#1b2022;--panel2:#22282a;--border:#32393b;--ink:#f0eee9;--muted:#9ca6a7;--accent:#ed8c5c;--radius:14px;--pad:22px}*{box-sizing:border-box}html{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}body{margin:0;font-size:14px}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}a{color:inherit}#app{display:grid;grid-template-columns:242px minmax(0,1fr);min-height:100vh}.sidebar{border-right:1px solid var(--border);background:#171b1d;padding:27px 17px;display:flex;flex-direction:column;gap:28px;position:sticky;top:0;height:100vh}.brand{display:flex;gap:12px;align-items:center;padding-left:10px}.brand-mark{border:1px solid #5e4f43;background:#2e2723;color:var(--accent);border-radius:13px;font-size:24px;font-weight:800;width:42px;height:42px;display:grid;place-items:center}.brand-mark span{color:#eee}.brand b{font-size:21px;letter-spacing:3px}.brand small{display:block;font-size:9px;letter-spacing:1.5px;color:var(--muted);margin-top:4px}.nav-label{font-size:10px;letter-spacing:2px;color:#707b7e;margin:2px 10px -12px}.sidebar nav{display:flex;flex-direction:column;gap:5px}.nav-item{background:transparent;border:0;color:#a7b1b2;text-align:left;border-radius:9px;padding:12px 14px;width:100%;display:flex;gap:13px;align-items:center;transition:.2s}.nav-item:hover{background:#22292a;color:#fff}.nav-item.active{color:#fff;background:#32302b}.nav-item.active .nav-icon{color:var(--accent)}.nav-icon{font-size:17px;width:21px;text-align:center}.sidebar-bottom{margin-top:auto;padding:13px 10px;border-top:1px solid var(--border);font-size:12px;color:#cfd4d2}.sidebar-bottom small{display:block;color:var(--muted);font-size:10px;margin:6px 0 0 17px}.signal{display:inline-block;width:7px;height:7px;background:#7fc8a0;border-radius:100%;margin-right:6px}main{min-width:0}.topbar{min-height:76px;border-bottom:1px solid var(--border);padding:17px clamp(22px,4vw,70px);display:flex;align-items:center;justify-content:space-between;gap:15px}.breadcrumb{letter-spacing:2px;font-size:10px;color:#aab1b0}.breadcrumb span{color:#60696c;padding:0 10px}.breadcrumb b{color:var(--ink)}.toolbar{display:flex;gap:9px;align-items:center}.ghost,.secondary,.primary,.small-btn{border:1px solid var(--border);color:var(--ink);background:transparent;border-radius:8px;padding:10px 14px;white-space:nowrap}.ghost:hover,.secondary:hover,.small-btn:hover{background:#2b3030}.secondary{background:#252b2c}.primary{background:var(--accent);color:#171716;border:1px solid var(--accent);font-weight:750}.primary:hover{filter:brightness(1.06)}.view{max-width:1330px;margin:0 auto;padding:42px clamp(22px,4vw,70px) 50px}.eyebrow{color:var(--accent);letter-spacing:2.8px;text-transform:uppercase;font-weight:700;font-size:10px}.page-heading{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:28px}.page-heading h1{margin:10px 0 6px;font-size:clamp(30px,4vw,49px);line-height:1.08;letter-spacing:-1.8px;font-weight:620}.page-heading p,.lead{color:var(--muted);margin:7px 0 0;line-height:1.7}.hero{border:1px solid #4b413a;border-radius:var(--radius);background:radial-gradient(ellipse at top right,#65412e77 0,transparent 52%),linear-gradient(115deg,#282b29,#242522);padding:31px;margin-bottom:25px;display:flex;justify-content:space-between;gap:20px;align-items:end}.hero h2{font-size:clamp(24px,3vw,38px);letter-spacing:-1.2px;margin:12px 0;line-height:1.18;max-width:570px}.hero p{max-width:520px;color:#c7c3bd;line-height:1.65}.hero-graphic{font-size:95px;color:var(--accent);font-weight:200;line-height:1;opacity:.85}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-bottom:28px}.metric{background:var(--panel);border:1px solid var(--border);padding:19px;border-radius:var(--radius)}.metric strong{font-size:26px;display:block;margin:7px 0 5px;font-weight:600}.metric small{font-size:11px;color:var(--muted)}.section-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:30px 0 15px}.section-head h2{font-size:17px;letter-spacing:-.3px;margin:0}.section-head small{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card,.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:var(--pad);min-width:0}.card{transition:.15s}.card:hover{border-color:#675244;transform:translateY(-2px)}.card-top{display:flex;align-items:center;justify-content:space-between}.card-icon{font-size:20px;background:#33332e;border:1px solid #464139;width:41px;height:41px;display:grid;place-items:center;border-radius:11px}.pill{font-size:10px;letter-spacing:.6px;background:#2b3433;color:#bad7c5;padding:6px 8px;border-radius:7px}.pill.future{background:#362e29;color:#e7b89a}.card h3{font-size:17px;margin:17px 0 7px}.card p{color:#a8b2b2;line-height:1.65;min-height:40px;font-size:12.5px}.card .cta{border:0;background:transparent;color:var(--accent);padding:5px 0 0;font-weight:700}.two-col{display:grid;grid-template-columns:1.15fr .85fr;gap:17px}.three-col{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.stack{display:grid;gap:15px}.panel h2,.panel h3{margin:0 0 13px;font-weight:620}.panel p{color:var(--muted);line-height:1.65}.label{font-size:11px;font-weight:700;letter-spacing:1px;color:#b9bdbc;margin-bottom:7px;display:block;text-transform:uppercase}.field,textarea,select{width:100%;background:#131718;color:var(--ink);border:1px solid #3d4547;border-radius:9px;padding:12px 13px}textarea{min-height:115px;resize:vertical;line-height:1.65}select{cursor:pointer}form .field,form textarea,form select{margin-bottom:12px}.btn-row{display:flex;gap:9px;flex-wrap:wrap}.muted{color:var(--muted)}.mini{font-size:12px;line-height:1.6}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.list-row{padding:12px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:start;gap:15px}.list-row:last-child{border:0}.list-row b{display:block}.list-row small{display:block;color:var(--muted);padding-top:5px}.note-color{color:var(--accent)}.empty{padding:22px;border:1px dashed #4a5252;border-radius:9px;color:var(--muted);text-align:center}.preview{background:#121718;border:1px solid #313a3b;border-radius:10px;padding:18px;white-space:pre-wrap;font:12px/1.7 ui-monospace,monospace;color:#dce3df;max-height:410px;overflow:auto}.tiny-btn{background:none;border:1px solid #424b4b;color:#c8d1cc;border-radius:7px;padding:6px 9px}.status-dot{display:inline-block;width:7px;height:7px;background:#e1a26a;border-radius:50%;margin-right:7px}.tv-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.tv-tile{min-height:103px;border-radius:13px;background:linear-gradient(145deg,#383330,#202627);display:flex;flex-direction:column;justify-content:space-between;padding:18px;border:1px solid #4b4540;color:#fff;text-decoration:none}.tv-tile b{font-size:20px}.tv-tile small{color:#c8bdb7}.flag{display:inline-block;margin-left:7px;color:var(--accent);font-size:10px}.result{border-left:2px solid #a0b2b3;background:#22292b;padding:11px 14px;margin:10px 0;border-radius:4px}.result.remove{border-color:#d58b70}.result.review{border-color:#e4c58e}.result.keep{border-color:#83b99c}.result small{color:var(--muted)}footer{text-align:center;font-size:10px;color:#737d7d;padding:0 20px 22px}footer a{color:#aab4b1}dialog{background:#22292b;color:#f5f3ee;border:1px solid #565b57;border-radius:16px;padding:26px;width:min(430px,95vw)}dialog::backdrop{background:#000b}dialog label{display:block;color:var(--muted);margin:16px 0}dialog input,dialog select{display:block;margin-top:8px}dialog input[type=color]{width:68px;height:37px;background:none;border:0;cursor:pointer}.dialog-heading{display:flex;justify-content:space-between;align-items:center}.dialog-heading h2{margin:0}#toast{position:fixed;bottom:24px;right:24px;background:#383d3b;color:#fff;padding:12px 17px;border:1px solid #626860;border-radius:8px;box-shadow:0 10px 40px #0005;display:none;z-index:5}.compact{--pad:15px}.compact .view{padding-top:25px}.compact .card h3{margin-top:11px}.check{display:flex;gap:11px;align-items:start;padding:12px 0;border-bottom:1px solid var(--border)}.check input{margin-top:4px;accent-color:var(--accent)}.muted-strong{color:#c8cfcc}.thumbnail{width:60px;height:60px;border-radius:7px;background:#303834;display:grid;place-items:center;font-size:23px}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.code-kbd{font-family:monospace;font-size:11px;color:#cbd1cb;padding:4px 6px;background:#343a38;border-radius:4px}@media(max-width:860px){#app{grid-template-columns:1fr}.sidebar{position:relative;height:auto;padding:15px;gap:10px}.sidebar nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;overflow:visible}.nav-item{width:100%;min-height:58px;flex-direction:column;justify-content:center;text-align:center;gap:4px;white-space:normal;font-size:10px;padding:7px 3px}.sidebar-bottom,.nav-label{display:none}.topbar{padding:14px 20px}.view{padding:26px 20px}.two-col{grid-template-columns:1fr}.brand{display:none}}@media(max-width:530px){.cards,.three-col,.metrics,.tv-grid{grid-template-columns:1fr}.toolbar{gap:4px}.toolbar button{font-size:10px;padding:8px}.hero-graphic{display:none}.hero{padding:19px}.page-heading{display:block}.breadcrumb{display:none}}

</style></head>
<body><div id="app">
<aside class="sidebar"><div class="brand"><div class="brand-mark">L<span>·</span></div><div><b>LESS</b><small>CONTROL ROOM / V0.1</small></div></div><div class="nav-label">WORKSPACE</div><nav id="navigation"></nav><div class="sidebar-bottom"><span class="signal"></span> Local-first prototype <small>No account or API key required</small></div></aside>
<main><header class="topbar"><div class="breadcrumb">YOUR SPACE <span>/</span> <b id="crumb">OVERVIEW</b></div><div class="toolbar"><button class="ghost" id="export-btn" title="Export your content">↗ Export data</button><button class="ghost" id="import-btn">↙ Import</button><input type="file" accept="application/json" id="import-file" hidden><button id="ui-btn" class="secondary">✳ Tune UI</button></div></header><div id="view" class="view"></div><footer>LESS / 9 TO 5 STUDIOS • Inspired by Riley Brown’s seven use cases, independently implemented • <a target="_blank" rel="noopener" href="https://youtu.be/4PO0x-myitw">Source video</a></footer></main>
</div><dialog id="ui-dialog"><form method="dialog"><div class="dialog-heading"><h2>Tune the interface</h2><button class="ghost">✕</button></div><p>Adjustments stay on your device. No build tools needed.</p><label>Accent color <input id="accent-color" type="color" value="#ed8c5c"></label><label>Density <select id="density"><option value="comfortable">Comfortable</option><option value="compact">Compact</option></select></label><label>Card corners <input type="range" id="radius" min="4" max="26" value="14"></label><button class="primary">Apply changes</button></form></dialog><div id="toast" role="status"></div><script>
/* LESS v0.1 — local-first, no network requests, no AI or device integrations. */
(() => {
'use strict';
const STORAGE='less-control-room-v1';
const modules=[
 {id:'home',icon:'▦',title:'Overview',short:'All seven concepts, one adaptable control room',badge:'Live'},
 {id:'tv',icon:'▣',title:'TV launcher',short:'A quiet landing page with only your approved services',badge:'Local prototype'},
 {id:'device',icon:'⌘',title:'Device lab',short:'Plan improvements before touching firmware',badge:'Planning'},
 {id:'studio',icon:'◈',title:'3D studio',short:'Turn rough creative ideas into shot lists and Blender prompts',badge:'Prompt builder'},
 {id:'filter',icon:'◇',title:'Information filter',short:'Review messages without noisy feeds or automatic deletion',badge:'Manual review'},
 {id:'agent',icon:'✺',title:'Agent desk',short:'Build one reusable instruction instead of another subscription',badge:'Prompt builder'},
 {id:'edit',icon:'⌁',title:'Video cleaner',short:'Spot repetition and filler in a pasted transcript',badge:'Heuristic'},
 {id:'workspace',icon:'□',title:'My workspace',short:'Notes, tasks and Obsidian-ready export',badge:'Local storage'}
];
const deviceSteps=['Identify exact model, OS build, and recovery method','Export settings and create a backup','Document an allowed, reversible change','Test with the device still functional','Only then consider another modification'];
const seed={version:1,notes:[],tasks:[],services:[{name:'YouTube',url:'https://www.youtube.com'},{name:'Netflix',url:'https://www.netflix.com'},{name:'Hulu',url:'https://www.hulu.com'}],device:{name:'',model:'',goal:'',steps:[]},storyboards:[],messages:[],ui:{accent:'#ed8c5c',density:'comfortable',radius:14}};
function clone(x){return JSON.parse(JSON.stringify(x));}
function load(){try {const raw=JSON.parse(localStorage.getItem(STORAGE));if(!raw||raw.version!==1)return clone(seed);return {...clone(seed),...raw,ui:{...seed.ui,...raw.ui}};}catch{return clone(seed);}}
let state=load(),route='home',cutResults=[],currentPrompt='';
const $=id=>document.getElementById(id);
function esc(value){return String(value??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function save(){localStorage.setItem(STORAGE,JSON.stringify(state));}
function toast(msg){const el=$('toast');el.textContent=msg;el.style.display='block';clearTimeout(window.__lessToast);window.__lessToast=setTimeout(()=>el.style.display='none',2600);}
function download(filename,text,type='text/plain'){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}
function applyTheme(){document.documentElement.style.setProperty('--accent',state.ui.accent);document.documentElement.style.setProperty('--radius',state.ui.radius+'px');document.body.classList.toggle('compact',state.ui.density==='compact');}
function heading(kicker,title,description,action=''){return `<div class="page-heading"><div><div class="eyebrow">${esc(kicker)}</div><h1>${esc(title)}</h1><p>${esc(description)}</p></div>${action}</div>`;}
function panel(title,inner){return `<section class="panel"><h2>${title}</h2>${inner}</section>`;}
function setRoute(next){if(!modules.some(m=>m.id===next))next='home';route=next;history.replaceState(null,'','#'+next);$('navigation').innerHTML=modules.map(m=>`<button class="nav-item ${m.id===route?'active':''}" data-route="${m.id}" aria-current="${m.id===route?'page':'false'}"><span class="nav-icon">${m.icon}</span>${m.title}</button>`).join('');$('crumb').textContent=modules.find(m=>m.id===route).title.toUpperCase();$('view').innerHTML=views[route]();if(route==='studio')updateStoryboardPrompt();if(route==='agent')updateAgentPrompt();}
const views={
 home(){return `${heading('Digital sovereignty / 07 systems','Less noise. More control.','Build only the features you actually use. Seven ideas, one local-first starting point.')}
 <div class="hero"><div><div class="eyebrow">The idea behind LESS</div><h2>Don't add another app.<br>Remove everything you don't need.</h2><p>Explore the seven concepts from the video, try local working tools, and shape the interface before connecting real services or hardware.</p><button class="primary" data-route="workspace">Open my workspace &nbsp;→</button></div><div class="hero-graphic">−</div></div>
 <div class="metrics"><div class="metric"><small>VIDEO IDEAS CATALOGED</small><strong>07</strong><small>Each has a dedicated module</small></div><div class="metric"><small>ACTIVE LOCAL TOOLS</small><strong>05</strong><small>Launch / triage / prompts / transcript / notes</small></div><div class="metric"><small>CONNECTED ACCOUNTS</small><strong>00</strong><small>You control when to integrate</small></div></div>
 <div class="section-head"><h2>Explore your modules</h2><small>Open one to test it</small></div><div class="cards">${modules.slice(1).map((m,i)=>`<article class="card"><div class="card-top"><div class="card-icon">${m.icon}</div><span class="pill ${i===1?'future':''}">${m.badge}</span></div><h3>0${i+1} / ${esc(m.title)}</h3><p>${esc(m.short)}</p><button class="cta" data-route="${m.id}">Explore module →</button></article>`).join('')}</div>`;},
 tv(){return `${heading('01 / Own the screen','A TV without the noise.','This is a browser launcher concept, not a TV OS replacement. No apps are removed from your television.')}
 ${panel('Your chosen services',`<div class="tv-grid">${state.services.map((s,i)=>`<a class="tv-tile" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer"><small>APP 0${i+1}</small><b>${esc(s.name)}</b><small>Open service ↗</small></a>`).join('')}</div>`)}<div class="two-col" style="margin-top:16px">${panel('Add a service',`<form id="service-form"><label class="label">Service name</label><input class="field" name="name" placeholder="Plex" required maxlength="40"><label class="label">Secure web address</label><input class="field" name="url" placeholder="https://..." required type="url"><button class="primary">Add tile</button></form>`)}${panel('Boundaries',`<p>Great for testing a clean home-screen layout on desktop, iPad, or a browser-enabled TV. To build a device-native launcher, we need your TV's <b>exact make, model, operating system</b> and the supported SDK.</p><span class="pill future">No debloating or firmware changes performed</span>`)}</div>`;},
 device(){return `${heading('02 / Make hardware yours','Device lab','A reversible, documented approach for TV boxes, handhelds, Pi devices, and readers.')}
 <div class="two-col">${panel('Choose the target',`<form id="device-form"><label class="label">Device name</label><input class="field" name="name" value="${esc(state.device.name)}" placeholder="M5Stack Cardputer ADV"><label class="label">Exact model / firmware</label><input class="field" name="model" value="${esc(state.device.model)}" placeholder="Version from device settings"><label class="label">Your desired change</label><textarea name="goal" placeholder="I want a cleaner interface and a notes viewer">${esc(state.device.goal)}</textarea><button class="primary">Save device plan</button></form>`)}${panel('Safety-first checklist',`<p class="mini">Click only when you've actually completed the step.</p>${deviceSteps.map((s,i)=>`<label class="check"><input type="checkbox" data-device-check="${i}" ${state.device.steps.includes(i)?'checked':''}><span>${esc(s)}</span></label>`).join('')}<p class="mini">A USB cable does not guarantee that a device can be unlocked. Follow model-specific official guidance and local laws.</p>`)}</div>`;},
 studio(){return `${heading('03 / Make more with less','Motion studio','Draft an animation brief and storyboard that can later feed Blender or an AI coding agent.')}
 <div class="two-col">${panel('Your creative brief',`<form id="story-form"><label class="label">Project title</label><input class="field" name="title" placeholder="Projector Putty product intro" value="My intro sequence"><label class="label">Visual direction</label><select name="style" id="story-style"><option value="Minimal brushed-metal product film">Minimal product film</option><option value="Monochrome claymation and studio lighting">Claymation studio</option><option value="Retro-futuristic terminal and holographic overlays">Retro-futurist</option></select><label class="label">What happens?</label><textarea name="scene" id="story-scene">A small physical device assembles itself from three pieces. A warm light turns on. End on a clean hero shot.</textarea><div class="btn-row"><button class="primary" type="submit">Save storyboard</button><button type="button" class="secondary" data-action="copy-story">Copy brief</button></div></form>`)}${panel('Generated shot plan',`<div id="story-preview" class="preview"></div><p class="mini">Starter Blender script included in the downloadable project kit. It runs locally in Blender; this page does not render video.</p>`)}</div><div class="section-head"><h2>Saved concepts</h2><small>${state.storyboards.length}</small></div>${state.storyboards.length?state.storyboards.map(s=>`<div class="list-row"><span><b>${esc(s.title)}</b><small>${esc(s.style)} — ${esc(s.created)}</small></span></div>`).join(''):'<div class="empty">No saved storyboards yet.</div>'}`;},
 filter(){return `${heading('04 / Stop scrolling','Information filter','Make the decision to keep, review, or ignore an item before it occupies your attention.')}
 <div class="two-col">${panel('Triage an item',`<form id="message-form"><label class="label">Source / sender</label><input class="field" name="from" required placeholder="Newsletter, person, or feed"><label class="label">Subject or title</label><input class="field" name="subject" required placeholder="New product update"><label class="label">Content preview</label><textarea name="body" required placeholder="Paste a short excerpt only"></textarea><label class="label">Your decision</label><select name="decision"><option value="review">Review later</option><option value="keep">Keep / important</option><option value="ignore">Ignore</option></select><button class="primary">Save to review queue</button></form><p class="mini">Nothing is deleted, archived, or sent in Gmail or social platforms. Sensitive messages should stay in their original secure systems.</p>`)}${panel('Review queue',`${state.messages.length?state.messages.slice().reverse().map((m,i)=>`<div class="list-row"><span><b>${esc(m.subject)}</b><small>${esc(m.from)} · ${esc(m.decision)} · ${esc(m.created)}</small><p class="mini">${esc(m.body.slice(0,140))}</p></span><button class="tiny-btn" data-remove-message="${state.messages.length-1-i}">Remove</button></div>`).join(''):'<div class="empty">Your queue is empty. Add one item to start filtering.</div>'}`)}</div>`;},
 agent(){return `${heading('05 / Apps into actions','Agent desk','Build small, reusable instructions for work you want an assistant to handle.')}
 <div class="two-col">${panel('Prompt designer',`<label class="label">Choose an action</label><select id="agent-type"><option value="notes">Turn research into notes</option><option value="inbox">Review my inbox safely</option><option value="asset">Organize my visual assets</option><option value="creator">Create a focused application</option><option value="device">Plan a device project</option></select><label class="label">Context</label><textarea id="agent-context" placeholder="Describe your goal, sources, constraints and what counts as done">Build one Obsidian note and one GitHub folder with the research, implementation and tests.</textarea><button class="primary" data-action="copy-agent">Copy generated prompt</button>`)}${panel('Your reusable instruction',`<div class="preview" id="agent-preview"></div><p class="mini">Copy into Claude, ChatGPT, or another coding agent. This is prompt generation, not an autonomous agent execution.</p>`)}</div>`;},
 edit(){return `${heading('06 / Cut the filler','Video cleaner','Paste a transcript to identify possible repetitions, filler, and rambling before editing.')}
 <div class="two-col">${panel('Transcript review',`<label class="label">Paste transcript (separate paragraphs or lines)</label><textarea id="transcript" style="min-height:250px" placeholder="Paste transcript here. Each line or paragraph is treated as a segment."></textarea><div class="btn-row"><button class="primary" data-action="analyze">Analyze text</button><button class="secondary" data-action="export-cuts">Export review</button></div><p class="mini">Rule-based suggestions only. No audio timestamps, direct media edits, or model judgments; verify every suggestion yourself.</p>`)}${panel('Suggested cuts',`<div id="cut-output"><div class="empty">Analyze some text to get a non-destructive review.</div></div>`)}</div>`;},
 workspace(){return `${heading('07 / Build your own software','My workspace','A small control center for notes, experiments, and priorities; nothing more.')}
 <div class="two-col">${panel('New note',`<form id="note-form"><label class="label">Title</label><input name="title" class="field" required maxlength="100" placeholder="My first LESS experiment"><label class="label">Note</label><textarea name="body" required placeholder="What am I trying to learn or build?"></textarea><button class="primary">Save note</button></form>`)}${panel('Add a task',`<form id="task-form"><label class="label">Next smallest step</label><input name="label" class="field" required maxlength="150" placeholder="Check TV model and OS"><button class="secondary">Add task</button></form><div id="task-list">${renderTasks()}</div>` )}</div>
 <div class="section-head"><h2>Notes library</h2><button class="secondary" data-action="export-obsidian">↓ Export for Obsidian</button></div><div class="stack">${state.notes.length?state.notes.slice().reverse().map((n,i)=>`<div class="panel"><div class="row"><div><small class="muted">${esc(n.created)}</small><h3 style="margin-top:6px">${esc(n.title)}</h3></div><button class="tiny-btn" data-remove-note="${state.notes.length-1-i}">Delete</button></div><p style="white-space:pre-wrap">${esc(n.body)}</p></div>`).join(''):'<div class="empty">Your notes will appear here, on this device.</div>'}</div>`;}
};
function renderTasks(){return state.tasks.length?state.tasks.map((t,i)=>`<label class="check"><input type="checkbox" data-task="${i}" ${t.done?'checked':''}><span style="${t.done?'text-decoration:line-through;opacity:.6':''}">${esc(t.label)}</span><button class="tiny-btn" data-delete-task="${i}" type="button" style="margin-left:auto">✕</button></label>`).join(''):'<p class="mini muted">No tasks yet.</p>';}
function storyText(){const form=$('story-form');const title=form.elements.title.value.trim()||'Untitled project';const style=form.elements.style.value;const scene=form.elements.scene.value.trim();return `BLENDER ANIMATION BRIEF — ${title}\nStyle: ${style}\nAction: ${scene}\n\nShot 1 / ESTABLISH (0–3s): introduce the object and environment.\nShot 2 / DETAIL (3–6s): reveal parts, materials, lighting.\nShot 3 / ACTION (6–10s): animate the central movement.\nShot 4 / HERO (10–12s): quiet final composition.\n\nConstraints: original assets only; no unauthorized logos. Produce storyboard first, Blender script second, render preview third. Check topology, camera, light, timings and performance before final export.`;}
function updateStoryboardPrompt(){if($('story-preview'))$('story-preview').textContent=storyText();}
const promptGoals={notes:'Summarize provided references into a dated, linked Obsidian note. Preserve verified facts and source URLs.',inbox:'Classify each provided email as urgent, important, later, or promotional; propose actions but do not archive, delete, send, or unsubscribe without approval.',asset:'Catalog my supplied design assets by colors, typography, material, and usage rights. Keep originals unchanged.',creator:'Design the smallest complete tool that performs my required tasks. Prefer local-first storage and an adjustable interface.',device:'Research the exact device and firmware version. Provide only reversible, model-verified steps and a recovery path.'};
function agentText(){const type=$('agent-type')?.value||'notes';const ctx=$('agent-context')?.value||'';return `ROLE: A careful builder using the LESS method.\nGOAL: ${promptGoals[type]}\nUSER CONTEXT: ${ctx.trim()}\n\nRULES:\n1. Verify sources; separate facts, claims, and assumptions.\n2. Preserve existing baselines. Change only what is requested.\n3. Identify what to remove before proposing new features.\n4. Show the smallest testable change and a clear acceptance check.\n5. Require explicit approval for destructive, external, account, or device actions.\n6. Package source, README, prompts, and Obsidian-ready notes.\n7. Do not claim an integration or device test succeeded unless it actually ran.\n\nDELIVERABLE: A brief plan, executable artifact, test result, and next small step.`;}
function updateAgentPrompt(){if($('agent-preview'))$('agent-preview').textContent=agentText();}
function safeWebUrl(value){try{const url=new URL(value);if(!['https:','http:'].includes(url.protocol))return null;return url.href;}catch{return null;}}
function triageTranscript(text){const segments=text.split(/\n+/).map(s=>s.trim()).filter(Boolean);const seen=[];return segments.map((s,i)=>{const tokens=new Set((s.toLowerCase().match(/[\p{L}\p{N}]+/gu)||[]).filter(w=>w.length>3));const repeat=seen.some(old=>{const union=new Set([...tokens,...old]);return tokens.size>3&&[...tokens].filter(t=>old.has(t)).length/Math.max(union.size,1)>.58;});seen.push(tokens);const fillers=(s.match(/\b(um|uh|you know|kind of|sort of|basically|literally|like I said)\b/gi)||[]).length;const long=s.split(/\s+/).length>65;const status=repeat?'remove':fillers>=2||long?'review':'keep';return {index:i+1,status,reason:repeat?'Possible repetition':fillers>=2?'Repeated filler phrases':long?'Long segment — consider tightening':'No obvious rule-based flag',text:s};});}
function renderResults(){const counts={remove:0,review:0,keep:0};cutResults.forEach(x=>counts[x.status]++);$('cut-output').innerHTML=`<p class="mini">${cutResults.length} segments · ${counts.remove} potential cuts · ${counts.review} review · ${counts.keep} no flags</p>`+cutResults.map(x=>`<div class="result ${x.status}"><small>SEGMENT ${x.index} · ${esc(x.reason)} · ${x.status.toUpperCase()}</small><div>${esc(x.text)}</div></div>`).join('');}
function asObsidian(){const header=`---\ntitle: LESS Control Room Notes\ntags: [ai, less, projects]\nsource: https://youtu.be/4PO0x-myitw\n---\n\n# LESS / Personal Notes\n\n`;const content=state.notes.map(n=>`## ${n.title}\n\nCreated: ${n.created}\n\n${n.body}\n`).join('\n---\n\n');return header+(content||'No notes saved yet.\n')+'\n## Tasks\n'+state.tasks.map(t=>`- [${t.done?'x':' '}] ${t.label}`).join('\n')+'\n';}
// One delegated handler keeps the prototype easy to extend without frameworks.
document.addEventListener('click',e=>{const b=e.target.closest('[data-route],[data-action],[data-remove-note],[data-remove-message],[data-delete-task]');if(!b)return;if(b.dataset.route){setRoute(b.dataset.route);return;}if(b.dataset.removeNote!==undefined){state.notes.splice(Number(b.dataset.removeNote),1);save();setRoute(route);return;}if(b.dataset.removeMessage!==undefined){state.messages.splice(Number(b.dataset.removeMessage),1);save();setRoute(route);return;}if(b.dataset.deleteTask!==undefined){state.tasks.splice(Number(b.dataset.deleteTask),1);save();setRoute(route);return;}switch(b.dataset.action){case 'export-obsidian':download('LESS-Control-Room.md',asObsidian(),'text/markdown');toast('Obsidian note exported');break;case 'copy-story':navigator.clipboard?.writeText(storyText()).then(()=>toast('Storyboard copied')).catch(()=>toast('Clipboard access unavailable'));break;case 'copy-agent':navigator.clipboard?.writeText(agentText()).then(()=>toast('Prompt copied')).catch(()=>toast('Clipboard access unavailable'));break;case 'analyze':cutResults=triageTranscript($('transcript').value);cutResults.length?renderResults():toast('Paste a transcript first');break;case 'export-cuts':if(!cutResults.length){toast('Analyze a transcript first');return;}download('LESS-transcript-review.json',JSON.stringify({source:'user supplied transcript',method:'heuristic',results:cutResults},null,2),'application/json');toast('Review exported');break;}});
document.addEventListener('input',e=>{if(['story-style','story-scene'].includes(e.target.id)||e.target.closest('#story-form'))updateStoryboardPrompt();if(['agent-type','agent-context'].includes(e.target.id))updateAgentPrompt();});
document.addEventListener('change',e=>{if(e.target.dataset.task!==undefined){state.tasks[Number(e.target.dataset.task)].done=e.target.checked;save();setRoute(route);}if(e.target.dataset.deviceCheck!==undefined){const i=Number(e.target.dataset.deviceCheck);state.device.steps=e.target.checked?[...new Set([...state.device.steps,i])]:state.device.steps.filter(x=>x!==i);save();}});
document.addEventListener('submit',e=>{const f=e.target;if(!f.id)return;e.preventDefault();const d=new FormData(f),get=k=>String(d.get(k)||'').trim();switch(f.id){case 'service-form':{const url=safeWebUrl(get('url'));if(!url){toast('Use an http or https address');return;}state.services.push({name:get('name'),url});break;}case 'device-form':state.device={...state.device,name:get('name'),model:get('model'),goal:get('goal')};break;case 'story-form':state.storyboards.push({title:get('title'),style:get('style'),scene:get('scene'),created:new Date().toLocaleDateString()});break;case 'message-form':state.messages.push({from:get('from'),subject:get('subject'),body:get('body'),decision:get('decision'),created:new Date().toLocaleDateString()});break;case 'note-form':state.notes.push({title:get('title'),body:get('body'),created:new Date().toLocaleDateString()});break;case 'task-form':state.tasks.push({label:get('label'),done:false});break;default:return;}save();setRoute(route);toast('Saved locally');});
$('export-btn').addEventListener('click',()=>{download('LESS-backup.json',JSON.stringify(state,null,2),'application/json');toast('Local backup exported');});
$('import-btn').addEventListener('click',()=>$('import-file').click());
$('import-file').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(obj.version!==1||!Array.isArray(obj.notes)||!Array.isArray(obj.tasks)||!Array.isArray(obj.services))throw Error('Invalid LESS backup');if(!confirm('Replace your local LESS data with this backup? Export first to keep a copy.'))return;state={...clone(seed),...obj,ui:{...seed.ui,...obj.ui}};save();applyTheme();setRoute(route);toast('Backup imported');}catch(err){toast('Import failed: '+err.message);}finally{e.target.value='';}});
$('ui-btn').addEventListener('click',()=>{$('accent-color').value=state.ui.accent;$('density').value=state.ui.density;$('radius').value=state.ui.radius;$('ui-dialog').showModal();});
$('ui-dialog').addEventListener('close',()=>{const accent=$('accent-color').value;if(!/^#[\da-f]{6}$/i.test(accent))return;state.ui={accent,density:$('density').value,radius:Number($('radius').value)};applyTheme();save();toast('UI preferences saved');});
applyTheme();setRoute(location.hash.slice(1)||'home');
})();

</script></body></html>
